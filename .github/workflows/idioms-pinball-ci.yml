# 選用：審核後複製到倉庫根目錄 .github/workflows/idioms-pinball-ci.yml
# 不做 npm install、不建置網站、不自動發布 GitHub Pages。
name: Idioms Pinball Checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_check:
        description: '執行正式題庫與遊戲測試發布檢查（不部署）'
        type: boolean
        default: true
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Codex workpack
        run: node codex-workpack/tools/verify-workpack.mjs
      - name: Test workpack contracts
        run: node --test codex-workpack/tests/*.test.mjs
      - name: Test game modules if tests exist
        shell: bash
        run: |
          shopt -s nullglob
          tests=(tests/*.test.mjs)
          if (( ${#tests[@]} > 0 )); then
            node --test "${tests[@]}"
          else
            echo "Game tests are not present yet; this is NOT a game test PASS."
          fi
  release-check:
    # v* 標籤及手動發布檢查必跑；一般開發 push/PR 允許資料尚待審。
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_check)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require approved data and passing game tests
        run: node codex-workpack/tools/check-release.mjs
