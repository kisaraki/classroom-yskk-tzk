<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>成語彈珠臺</title><link rel="stylesheet" href="./assets/css/style.css?v=20261114.4"></head><body>
<header><strong>◉ 成語彈珠臺</strong><span id="environment">字字相連，挑戰五關</span><button id="sensor-info">感測狀態</button><button id="about">玩法與來源</button></header>
<main id="home"><section class="intro"><small>觀音風華 · 成語挑戰</small><h1>讀觀音，<span>拾字成章。</span></h1><p>控制「我」的彈珠，依序找到四個字。<br>讀注音、懂意思，一路闖過五個關卡。</p><figure class="guanyin-scroll"><img src="./assets/art/guanyin-scroll.png" width="1536" height="1024" alt="觀音地方意象水墨拼景：觀音國中校門、IKEA桃園物流中心、白沙岬燈塔、甘泉寺、台61線、草漯沙丘與落日、風力發電、大潭電廠及蓮花。"><figcaption>校園・蓮鄉・信仰・海岸・產業，共繪觀音風華</figcaption></figure><div id="levels"></div><div class="organizers"><p>2026桃園市立觀音國民中學國語文領域教學研究會</p><p>圖書館閱讀推動教師團隊</p></div><p class="hint">傾斜平板或拖曳搖桿操作<br>桌機也可使用方向鍵或 WASD</p></section><section class="name-card"><h2>準備好出發了嗎？</h2><p>使用下方鍵盤輸入玩家名稱</p><div class="name-row"><output id="player-name"></output><small id="name-length"></small></div><div role="tablist"><button data-keyboard-mode="latin" role="tab" aria-selected="true">英數鍵盤</button><button data-keyboard-mode="chinese" role="tab" aria-selected="false">常用中文字</button></div><div id="keyboard"></div><div id="preset-names"></div><p id="data-status" role="status">載入題庫中…</p><div class="actions"><button id="retry-data">重新載入</button><button id="start" class="primary" disabled>開始挑戰 →</button></div></section></main>
<main id="game" hidden><section class="hud"><div class="stats"><strong id="player-label"></strong><span id="level-label"></span><span id="question-label"></span><strong id="timer"></strong><button id="pause">P 暫停</button><button id="restart">R 重來</button><button id="retry">A × 3</button></div><div id="cards" aria-live="polite"></div><p id="definition"></p><div id="feedback" role="status"></div></section><div class="board"><canvas id="canvas" aria-label="彈珠場地，請依序碰撞標記1到4的目標"></canvas><section id="overlay" hidden><div><h2 id="overlay-title"></h2><p id="overlay-text"></p><button id="continue" class="primary">繼續</button></div></section></div><footer><div id="joystick" aria-label="拖曳虛擬搖桿"><div class="joystick-knob"></div></div><span id="control-mode">手動搖桿</span><button id="mode">切換傾斜／搖桿</button><button id="calibrate">校正水平</button><label><input id="sound" type="checkbox"> 音效</label></footer></main>
<div id="portrait"><h2>請將平板橫放 ↻</h2><p>轉回橫向後，按繼續恢復遊戲。</p></div><dialog id="dialog"><h2 id="dialog-title"></h2><p id="dialog-text"></p><pre id="sensor-status" hidden></pre><nav id="source-links" aria-label="官方資料與授權" hidden><a href="https://dict.idioms.moe.edu.tw/" target="_blank" rel="noopener noreferrer">教育部《成語典》</a> · <a href="./assets/legal/idiomsdict_10409.pdf" target="_blank" rel="noopener noreferrer">完整公眾授權使用說明（PDF）</a></nav><div class="actions"><button id="sensor-retry" hidden>重新要求感測權限</button><button id="cancel">取消</button><button id="confirm" class="primary">確定</button></div></dialog><script type="module" src="./assets/js/main.js?v=20261114.4"></script></body></html>
